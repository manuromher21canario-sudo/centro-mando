<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#23314D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mando">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-32.png">
<link rel="apple-touch-icon" href="icono-180.png">
<title>Centro de mando</title>
<style>
  :root {
    --fondo: #F3F1EC; --papel: #FFFFFF; --tinta: #1F2328; --gris: #6B6F76; --linea: #E3E0D8;
    --mando: #23314D; --mando-claro: #E6EAF3; --ambar: #C9851B; --ambar-claro: #FBF0DC;
    --verde: #1E7B4A; --verde-claro: #E3F3E9; --rojo: #B3261E; --rojo-claro: #FBE7E5; --azul: #2457A6;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 16px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 3px solid var(--ambar); outline-offset: 2px; }
  h1, h2, h3 { margin: 0; }
  .oculto { display: none !important; }

  /* Entrada */
  .entrada { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .caja { background: var(--papel); border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 400px; box-shadow: 0 6px 30px rgba(0,0,0,.08); }
  .logo { font-size: 40px; }
  .caja h1 { font-size: 26px; margin: 6px 0 4px; }
  .caja p { color: var(--gris); margin: 0 0 18px; line-height: 1.5; }
  .eleccion { display: grid; gap: 10px; }
  .eleccion button { border: 2px solid var(--linea); border-radius: 14px; padding: 16px; text-align: left; font-size: 17px; font-weight: 700; display: flex; gap: 12px; align-items: center; }
  .eleccion button small { display: block; font-weight: 400; color: var(--gris); font-size: 14px; }
  .eleccion button span { font-size: 28px; }
  .campo { display: block; margin-bottom: 12px; }
  .campo b { display: block; font-size: 14px; color: var(--gris); margin: 0 0 5px 2px; font-weight: 600; }
  .campo input, .campo select, .campo textarea { width: 100%; border: 2px solid var(--linea); border-radius: 12px; padding: 11px 12px; background: #fff; font-size: 16px; }
  .campo textarea { min-height: 90px; resize: vertical; }
  .principal { background: var(--mando); color: #fff; border-radius: 12px; padding: 13px 18px; font-weight: 700; font-size: 16px; }
  .secundario { background: var(--mando-claro); color: var(--mando); border-radius: 12px; padding: 11px 16px; font-weight: 700; }
  .ancho { width: 100%; }
  .error { color: var(--rojo); min-height: 22px; margin-top: 10px; font-size: 15px; }
  .recordar { display: flex; gap: 8px; align-items: center; color: var(--gris); font-size: 15px; margin: 4px 0 14px; }
  .enlace { color: var(--gris); text-decoration: underline; padding: 8px 0; font-size: 15px; }

  /* Jefe */
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .menu { background: var(--mando); color: #fff; padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; }
  .menu .marca { font-weight: 800; font-size: 18px; padding: 4px 10px 16px; }
  .menu .marca small { display: block; font-weight: 400; opacity: .7; font-size: 13px; }
  .menu button { color: #fff; text-align: left; padding: 10px 12px; border-radius: 10px; font-size: 15px; display: flex; gap: 10px; align-items: center; opacity: .85; }
  .menu button:hover { background: rgba(255,255,255,.08); opacity: 1; }
  .menu button.activa { background: rgba(255,255,255,.16); opacity: 1; font-weight: 700; }
  .menu .salir { margin-top: auto; }
  .num { margin-left: auto; background: var(--ambar); color: #fff; border-radius: 20px; font-size: 12px; padding: 1px 8px; font-weight: 700; }
  main { padding: 26px 28px 60px; max-width: 1100px; width: 100%; }
  .cabecera { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .cabecera h1 { font-size: 26px; }
  .cabecera .derecha { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .sub { color: var(--gris); margin: -10px 0 18px; line-height: 1.5; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .tarjeta { background: var(--papel); border-radius: 16px; padding: 16px 18px; border: 1px solid var(--linea); }
  .tarjeta h3 { font-size: 15px; color: var(--gris); font-weight: 600; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
  .tarjeta .grande { font-size: 30px; font-weight: 800; }
  .tarjeta .grande small { font-size: 15px; color: var(--gris); font-weight: 400; }
  .tarjeta p { margin: 6px 0 0; color: var(--gris); font-size: 14px; line-height: 1.45; }
  .tarjeta.clic { cursor: pointer; }
  .tarjeta.clic:hover { border-color: var(--mando); }
  .ancha { grid-column: 1 / -1; }
  .lista { display: grid; gap: 8px; }
  .item { background: var(--papel); border: 1px solid var(--linea); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
  .item .cuerpo { flex: 1; min-width: 0; }
  .item .titulo { font-weight: 700; }
  .item .detalle { color: var(--gris); font-size: 14px; margin-top: 3px; line-height: 1.45; overflow-wrap: anywhere; }
  .item .acciones { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .item .acciones button { padding: 7px 10px; border-radius: 10px; background: #F1EFEA; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .item.quitado { opacity: .55; }
  .marca-check { width: 30px; height: 30px; flex: none; border-radius: 50%; border: 2px solid var(--linea); display: grid; place-items: center; font-size: 16px; background: #fff; }
  .marca-check.si { background: var(--verde); border-color: var(--verde); color: #fff; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 20px; padding: 2px 9px; margin: 2px 4px 0 0; background: #EEE; color: var(--gris); }
  .chip.principal { background: var(--rojo-claro); color: var(--rojo); }
  .chip.secundaria { background: var(--ambar-claro); color: #8A5A0E; }
  .chip.terciaria { background: var(--mando-claro); color: var(--mando); }
  .chip.verde { background: var(--verde-claro); color: var(--verde); }
  .chip.ambar { background: var(--ambar-claro); color: #8A5A0E; }
  .chip.rojo { background: var(--rojo-claro); color: var(--rojo); }
  .pestanas { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .pestanas button { padding: 9px 14px; border-radius: 20px; background: var(--papel); border: 1px solid var(--linea); font-weight: 600; font-size: 15px; }
  .pestanas button.activa { background: var(--mando); color: #fff; border-color: var(--mando); }
  .vacio { color: var(--gris); text-align: center; padding: 26px 12px; background: var(--papel); border-radius: 14px; border: 1px dashed var(--linea); line-height: 1.5; }
  .barra { height: 10px; border-radius: 6px; background: #EEE; overflow: hidden; margin-top: 8px; }
  .barra div { height: 100%; background: var(--verde); border-radius: 6px; }
  .tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tres div { background: var(--fondo); border-radius: 12px; padding: 10px; }
  .tres b { display: block; font-size: 20px; }
  .tres span { color: var(--gris); font-size: 13px; }
  .mas { color: var(--verde); } .menos { color: var(--rojo); }
  .pasos { display: flex; gap: 3px; margin-top: 8px; }
  .pasos i { flex: 1; height: 6px; border-radius: 3px; background: #E7E4DD; }
  .pasos i.si { background: var(--ambar); }

  /* Ventana */
  .velo { position: fixed; inset: 0; background: rgba(20,24,32,.45); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .ventana { background: var(--papel); border-radius: 18px; padding: 20px; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; }
  .ventana h2 { font-size: 20px; margin-bottom: 14px; }
  .ventana .botones { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; flex-wrap: wrap; }
  .codigo-grande { font-size: 40px; font-weight: 800; letter-spacing: 6px; text-align: center; background: var(--ambar-claro); border-radius: 14px; padding: 14px; margin: 10px 0; }
  .aviso { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--tinta); color: #fff; border-radius: 14px; padding: 12px 16px; display: flex; gap: 14px; align-items: center; z-index: 20; max-width: calc(100% - 32px); }
  .aviso button { color: #FFD27A; font-weight: 700; }
  .cargando { opacity: .6; pointer-events: none; }

  /* Equipo */
  .equipo { max-width: 640px; margin: 0 auto; padding: 22px 16px 60px; }
  .equipo .hola { background: var(--mando); color: #fff; border-radius: 18px; padding: 20px; margin-bottom: 16px; }
  .equipo .hola h1 { font-size: 24px; }
  .equipo .hola p { margin: 6px 0 0; opacity: .85; line-height: 1.5; }
  .mision { background: var(--papel); border: 1px solid var(--linea); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .mision h2 { font-size: 18px; margin: 6px 0; }
  .mision .bloque { background: var(--fondo); border-radius: 12px; padding: 10px 12px; margin-top: 10px; line-height: 1.5; white-space: pre-line; font-size: 15px; }
  .mision .bloque b { display: block; font-size: 13px; color: var(--gris); margin-bottom: 2px; }
  .mision .botones { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .mision.hecha { opacity: .7; }
  .demo { background: var(--ambar-claro); color: #8A5A0E; text-align: center; padding: 8px 12px; font-size: 14px; }
  .chip.atrasada { background: var(--rojo); color: #fff; }
  .rapido { position: fixed; right: 20px; bottom: 20px; width: 58px; height: 58px; border-radius: 50%; background: var(--ambar); color: #fff; font-size: 30px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 8; }
  .rapido-tipos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tablon { background: var(--ambar-claro); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; line-height: 1.5; white-space: pre-line; }
  .tablon b { display: block; font-size: 13px; color: #8A5A0E; }
  .instalar { background: var(--ambar); color: #fff; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .menu { position: sticky; top: 0; height: auto; flex-direction: row; overflow-x: auto; padding: 8px; z-index: 5; gap: 4px; }
    .menu .marca { display: none; }
    .menu button { white-space: nowrap; padding: 9px 10px; font-size: 14px; }
    .menu .salir { margin-top: 0; }
    main { padding: 18px 16px 60px; }
    .item { flex-wrap: wrap; }
    .item .acciones { width: 100%; justify-content: flex-start; }
  }
</style>
</head>
<body>
<div id="demo" class="demo oculto">Modo de prueba: los datos son de ejemplo y no se guardan en ningún sitio.</div>

<!-- Entrada -->
<section id="entrada" class="entrada">
  <div class="caja">
    <div class="logo">🧭</div>
    <h1>Centro de mando</h1>
    <p id="entrada-texto">¿Quién eres?</p>
    <div id="paso-eleccion" class="eleccion">
      <button data-entrar="jefe"><span>👑</span><div>Soy el jefe<small>Entro con mi contraseña</small></div></button>
      <button data-entrar="equipo"><span>🧑‍🔧</span><div>Soy del equipo<small>Entro con mi código de 6 cifras</small></div></button>
    </div>
    <form id="paso-clave" class="oculto">
      <label class="campo"><b id="clave-etiqueta">Contraseña</b><input id="clave" type="password" autocomplete="current-password"></label>
      <label class="recordar"><input type="checkbox" id="recordar" checked> Recordarme en este aparato</label>
      <button class="principal ancho" type="submit">Entrar</button>
      <button class="enlace" type="button" id="volver-eleccion">← Volver</button>
      <div class="error" id="error-entrada"></div>
    </form>
  </div>
</section>

<!-- Jefe -->
<section id="jefe" class="app oculto">
  <nav class="menu" id="menu"></nav>
  <main id="contenido"></main>
  <button class="rapido" id="rapido" title="Apuntar rápido" aria-label="Apuntar rápido">＋</button>
</section>

<!-- Equipo -->
<section id="equipo" class="equipo oculto"></section>

<script src="demo.js"></script>
<script>
// Dirección del cerebro en Google (se rellena al publicar). Con ?demo se usa un cerebro de mentira.
const API = "https://script.google.com/macros/s/AKfycbz6_iBhLxpc2W-Jt2hrWlQkLzi3pKTuRQ227mX7cgHMrDPHpN076yup-2Wu2b1X3HtT/exec";
const MODO_DEMO = /[?&]demo\b/.test(location.search) || API.indexOf("PEGAR") === 0;
const GUARDADA = "centro_mando_sesion";

const $ = (s, el) => (el || document).querySelector(s);
const esc = (t) => String(t === null || t === undefined ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const euros = (n) => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString("es-ES", { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + " €";
const hoyTexto = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fechaCorta = (ms) => { if (!ms) return ""; const d = new Date(ms); return d.toLocaleDateString("es-ES", { day: "numeric", month: "short" }); };
const haceCuanto = (ms) => {
  if (!ms) return "nunca";
  const min = Math.round((Date.now() - ms) / 60000);
  if (min < 2) return "ahora mismo"; if (min < 60) return "hace " + min + " min";
  const h = Math.round(min / 60); if (h < 24) return "hace " + h + " h";
  const d = Math.round(h / 24); return d === 1 ? "ayer" : "hace " + d + " días";
};
const leerGuardada = () => { try { return JSON.parse(localStorage.getItem(GUARDADA) || "null"); } catch (e) { return null; } };
const guardarSesion = (s) => { try { s ? localStorage.setItem(GUARDADA, JSON.stringify(s)) : localStorage.removeItem(GUARDADA); } catch (e) {} };

// ---------- Hablar con el cerebro ----------
let sesion = null;   // { como: "jefe"|"equipo", secreto }
function llamar(extra) {
  const cuerpo = Object.assign(sesion.como === "jefe" ? { clave: sesion.secreto } : { codigo: sesion.secreto }, extra || {});
  if (MODO_DEMO) return Promise.resolve(window.cerebroDemo(cuerpo));
  return fetch(API, { method: "POST", body: JSON.stringify(cuerpo) }).then((r) => r.json());
}
const ERRORES = {
  clave: "Esa contraseña no es.", codigo: "Ese código no es. Pídele uno nuevo a Emmanuel.",
  bloqueado: "Demasiados intentos. Espera 15 minutos.", "sin-clave": "Todavía no hay contraseña puesta en Google (mira la guía).",
  red: "No hay conexión con Google. Prueba otra vez.", "no-existe": "Eso ya no existe (¿lo quitaron?).", accion: "Eso no se puede hacer desde aquí."
};
const textoError = (e) => {
  e = String(e || "");
  if (ERRORES[e]) return ERRORES[e];
  if (e.indexOf("falta:") === 0) return "Falta rellenar: " + e.slice(6).split(",").map((k) => (ETIQUETAS[k] || k).toLowerCase()).join(", ") + ".";
  if (e.indexOf("numero:") === 0) return "Revisa el número de «" + (ETIQUETAS[e.slice(7)] || e.slice(7)) + "».";
  return "Algo ha fallado (" + e + ").";
};

// ---------- Entrada ----------
let entrandoComo = "jefe";
document.querySelectorAll("[data-entrar]").forEach((b) => b.onclick = () => {
  entrandoComo = b.dataset.entrar;
  $("#paso-eleccion").classList.add("oculto"); $("#paso-clave").classList.remove("oculto");
  const jefe = entrandoComo === "jefe";
  $("#clave-etiqueta").textContent = jefe ? "Contraseña" : "Tu código (6 cifras)";
  $("#clave").type = jefe ? "password" : "text";
  $("#clave").inputMode = jefe ? "text" : "numeric";
  $("#clave").autocomplete = jefe ? "current-password" : "one-time-code";
  $("#entrada-texto").textContent = jefe ? "Hola, jefe 👑" : "Hola 👋 Escribe el código que te dio Emmanuel.";
  $("#error-entrada").textContent = ""; $("#clave").value = ""; $("#clave").focus();
});
$("#volver-eleccion").onclick = () => {
  $("#paso-clave").classList.add("oculto"); $("#paso-eleccion").classList.remove("oculto"); $("#entrada-texto").textContent = "¿Quién eres?";
};
$("#paso-clave").onsubmit = (e) => {
  e.preventDefault();
  const secreto = $("#clave").value.trim();
  if (!secreto) return;
  sesion = { como: entrandoComo, secreto: secreto };
  $("#paso-clave").classList.add("cargando");
  llamar({}).then((r) => {
    $("#paso-clave").classList.remove("cargando");
    if (!r.ok) { $("#error-entrada").textContent = textoError(r.error); sesion = null; return; }
    if ($("#recordar").checked) guardarSesion(sesion);
    recibir(r);
  }).catch(() => { $("#paso-clave").classList.remove("cargando"); $("#error-entrada").textContent = ERRORES.red; sesion = null; });
};
function salir() {
  guardarSesion(null); sesion = null; datos = null; apartado = "inicio"; subpestana = {};
  ["jefe", "equipo"].forEach((id) => $("#" + id).classList.add("oculto"));
  $("#entrada").classList.remove("oculto"); $("#volver-eleccion").click();
}
function recibir(r) {
  $("#entrada").classList.add("oculto");
  if (r.quien === "jefe") { datos = r.datos; avisoEquipo = r.aviso || ""; $("#jefe").classList.remove("oculto"); pintarJefe(); }
  else { equipoDatos = r; $("#equipo").classList.remove("oculto"); pintarEquipo(); }
}

// ---------- Avisos con Deshacer ----------
let temporizadorAviso;
function avisar(texto, deshacer) {
  const viejo = $(".aviso"); if (viejo) viejo.remove();
  clearTimeout(temporizadorAviso);
  const a = document.createElement("div");
  a.className = "aviso";
  a.innerHTML = "<span>" + esc(texto) + "</span>" + (deshacer ? "<button>↶ Deshacer</button>" : "");
  document.body.appendChild(a);
  if (deshacer) a.querySelector("button").onclick = () => { a.remove(); deshacer(); };
  temporizadorAviso = setTimeout(() => a.remove(), deshacer ? 8000 : 3500);
}

// =====================================================================
// JEFE
// =====================================================================
let datos = null, apartado = "inicio", subpestana = {}, avisoEquipo = "";
const APARTADOS = [
  ["inicio", "🏠", "Inicio"], ["tareas", "✅", "Tareas"], ["equipo", "👥", "Equipo"], ["dinero", "💶", "Dinero"],
  ["clientes", "🤝", "Clientes"], ["ideas", "💡", "Ideas"], ["encuestas", "📋", "Encuestas"], ["talleres", "🛠️", "Talleres"]
];
const ETIQUETAS = {
  titulo: "Qué hay que hacer", porque: "Por qué (para que lo entienda)", como: "Cómo hacerlo (pasos)", para: "Para quién",
  idea: "Idea", prioridad: "Prioridad", estado: "Estado", para_cuando: "Para cuándo", comentario: "Lo que ha contado",
  nombre: "Nombre", rol: "En qué ayuda", tipo: "Tipo", concepto: "Concepto", categoria: "Categoría", importe: "Importe (€)",
  dia: "Día", negocio: "Negocio", clase: "Clase", que: "Qué servicio o app", contacto: "Por dónde se habla", notas: "Notas",
  paso: "En qué paso está", siguiente: "Siguiente paso", enlace: "Enlace", hechas: "Tareas hechas", total: "Tareas en total",
  hoja: "ID de la hoja de respuestas", meta: "Respuestas que queremos"
};
const PASOS_IDEA = ["idea", "lienzo", "marca", "prototipo", "presentación", "probando con clientes", "vendiendo"];
const CATEGORIAS = { ingreso: ["Servicios", "Apps", "Plantillas", "Otros ingresos"], gasto: ["Herramientas y web", "Material", "Publicidad", "Legal", "Otros gastos"] };

// Formularios de cada tabla: [campo, tipo de casilla, opciones]
function formulario(tabla) {
  const gente = [["jefe", "Yo (jefe)"]].concat(vivos("Equipo").map((p) => [p.id, p.nombre]));
  const ideas = [["", "—"]].concat(vivos("Ideas").map((i) => [i.nombre, i.nombre]));
  return {
    Tareas: [["titulo", "texto"], ["para", "lista", gente], ["prioridad", "lista", [["principal", "Principal"], ["secundaria", "Secundaria"], ["terciaria", "Terciaria"]]],
             ["porque", "largo"], ["como", "largo"], ["idea", "lista", ideas], ["para_cuando", "fecha"]],
    Equipo: [["nombre", "texto"], ["rol", "texto"]],
    Dinero: [["tipo", "lista", [["ingreso", "💚 Ingreso (lo que gano)"], ["gasto", "🔻 Gasto (lo que pago)"]]], ["concepto", "texto"], ["importe", "numero"],
             ["categoria", "lista", CATEGORIAS.ingreso.concat(CATEGORIAS.gasto).map((c) => [c, c])], ["idea", "lista", ideas], ["dia", "fecha"]],
    Clientes: [["nombre", "texto"], ["negocio", "texto"], ["clase", "lista", [["servicio", "Servicio (lo hago yo)"], ["app", "App (la usa)"]]], ["que", "texto"],
               ["estado", "lista", [["posible", "Posible"], ["hablando", "Hablando"], ["cliente", "Cliente"], ["ya no", "Ya no"]]], ["contacto", "texto"], ["importe", "numero"], ["notas", "largo"]],
    Ideas: [["nombre", "texto"], ["paso", "lista", PASOS_IDEA.concat(["en pausa", "descartada"]).map((p) => [p, p[0].toUpperCase() + p.slice(1)])], ["siguiente", "texto"], ["enlace", "texto"], ["notas", "largo"]],
    Talleres: [["nombre", "texto"], ["estado", "lista", [["en marcha", "En marcha"], ["en pausa", "En pausa"], ["terminado", "Terminado"]]], ["hechas", "numero"], ["total", "numero"], ["enlace", "texto"], ["notas", "largo"]],
    Encuestas: [["nombre", "texto"], ["idea", "lista", ideas], ["enlace", "texto"], ["hoja", "texto"], ["meta", "numero"]]
  }[tabla];
}
const vivos = (tabla) => (datos && datos[tabla] || []).filter((x) => !x.quitado);
const quitados = (tabla) => (datos && datos[tabla] || []).filter((x) => x.quitado);
const nombreDe = (id) => id === "jefe" ? "Yo" : ((datos.Equipo || []).find((p) => p.id === id) || {}).nombre || "Sin asignar";

function pintarJefe() {
  const pendientes = vivos("Tareas").filter((t) => t.estado !== "hecha").length;

    APARTADOS.map(([id, ico, nom]) => '<button data-ir="' + id + '" class="' + (apartado === id ? "activa" : "") + '">' + ico + " " + nom +

  const pintor = { inicio: pInicio, tareas: pTareas, equipo: pEquipo, dinero: pDinero, clientes: pClientes, ideas: pIdeas, encuestas: pEncuestas, talleres: pTalleres }[apartado];

$("#menu").onclick = (e) => {

const cabecera = (titulo, botones, sub) => '<div class="cabecera"><h1>' + titulo + '</h1><div class="derecha">' + (botones || "") + "</div></div>" + (sub ? '<p class="sub">' + sub + "</p>" : "");
const botonNuevo = (tabla, texto, extra) => '<button class="principal" data-nuevo="' + tabla + '"' + (extra ? " data-extra='" + esc(JSON.stringify(extra)) + "'" : "") + ">＋ " + texto + "</button>";
const botonesItem = (tabla, x, mas) => '<div class="acciones">' + (mas || "") + (x.quitado
  ? '<button data-recuperar="' + tabla + '" data-id="' + x.id + '">↩ Recuperar</button>'
  : '<button data-editar="' + tabla + '" data-id="' + x.id + '">✏️ Cambiar</button><button data-quitar="' + tabla + '" data-id="' + x.id + '">🗑 Quitar</button>') + "</div>";
const bloqueQuitados = (tabla, pintar) => {
  const q = quitados(tabla); if (!q.length) return "";
  return '<details style="margin-top:18px"><summary class="enlace">Quitados (' + q.length + ") — se pueden recuperar</summary><div class=\"lista\" style=\"margin-top:8px\">" + q.map(pintar).join("") + "</div></details>";
};

// ---------- Dinero (cuentas) ----------
function cuentas() {
  const hoy = hoyTexto(), mes = hoy.slice(0, 7), anio = hoy.slice(0, 4);
  const t = { hoy: { i: 0, g: 0 }, mes: { i: 0, g: 0 }, anio: { i: 0, g: 0 }, todo: { i: 0, g: 0 } };
  vivos("Dinero").forEach((m) => {
    const d = String(m.dia || ""), k = m.tipo === "gasto" ? "g" : "i", n = Number(m.importe) || 0;
    t.todo[k] += n; if (d.slice(0, 4) === anio) t.anio[k] += n; if (d.slice(0, 7) === mes) t.mes[k] += n; if (d === hoy) t.hoy[k] += n;
  });
  return t;
}
const tresCifras = (c) => '<div class="tres"><div><span>Gano</span><b class="mas">' + euros(c.i) + '</b></div><div><span>Gasto</span><b class="menos">' + euros(c.g) +
  '</b></div><div><span>Me queda</span><b class="' + (c.i - c.g >= 0 ? "mas" : "menos") + '">' + euros(c.i - c.g) + "</b></div></div>";

// ---------- 🏠 Inicio ----------
function pInicio() {
  const tareas = vivos("Tareas"), pend = tareas.filter((t) => t.estado !== "hecha");
  const orden = { principal: 0, secundaria: 1, terciaria: 2, "": 3 };
  const mias = pend.filter((t) => t.para === "jefe" || !t.para).sort((a, b) => (orden[a.prioridad || ""] - orden[b.prioridad || ""]));
  const delEquipo = pend.filter((t) => t.para && t.para !== "jefe");
  const recienHechas = tareas.filter((t) => t.estado === "hecha" && t.para !== "jefe" && t.hecha_el).sort((a, b) => b.hecha_el - a.hecha_el).slice(0, 3);
  const c = cuentas();
  const cli = vivos("Clientes"), serv = cli.filter((x) => x.clase === "servicio"), apps = cli.filter((x) => x.clase === "app");
  const deVerdad = (l) => l.filter((x) => x.estado === "cliente").length;
  const enc = vivos("Encuestas"), resp = enc.reduce((s, e) => s + (Number(e.respuestas) || 0), 0), meta = enc.reduce((s, e) => s + (Number(e.meta) || 0), 0);
  const talleres = vivos("Talleres").filter((t) => t.estado === "en marcha");
  const ideasVivas = vivos("Ideas").filter((i) => i.paso !== "descartada" && i.paso !== "en pausa");
  const equipo = vivos("Equipo");
  const saludo = new Date().getHours() < 14 ? "Buenos días" : new Date().getHours() < 21 ? "Buenas tardes" : "Buenas noches";

  const semana = pend.filter((t) => t.para_cuando && String(t.para_cuando) <= dentroDe(7)).sort((a, b) => String(a.para_cuando).localeCompare(String(b.para_cuando)));
  return cabecera(saludo + ", jefe 👑", "", new Date().toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" })) +
  '<div class="rejilla">' +
    '<div class="tarjeta ancha"><h3>🎯 Te toca a ti</h3>' + (mias.length ? '<div class="lista">' + mias.slice(0, 5).map(itemTarea).join("") + "</div>" + (mias.length > 5 ? '<p>…y ' + (mias.length - 5) + " más en Tareas.</p>" : "")
      : '<p>No tienes nada pendiente. ¡Bien! 🎉</p>') + "</div>" +
    (semana.length ? '<div class="tarjeta ancha"><h3>📅 Esta semana' + (semana.some(atrasada) ? ' <span class="chip atrasada">' + semana.filter(atrasada).length + " atrasada" + (semana.filter(atrasada).length === 1 ? "" : "s") + "</span>" : "") +
      '</h3><div class="lista">' + semana.map(itemTarea).join("") + "</div></div>" : "") +
    '<div class="tarjeta clic" data-ir-a="dinero"><h3>💶 Dinero de este mes</h3>' + tresCifras(c.mes) + "<p>Desde el principio te quedan " + euros(c.todo.i - c.todo.g) + ".</p></div>" +
    '<div class="tarjeta clic" data-ir-a="clientes"><h3>🤝 Clientes</h3><div class="grande">' + (deVerdad(serv) + deVerdad(apps)) + ' <small>de verdad</small></div><p>Servicios: ' + serv.length + " (" + deVerdad(serv) + " clientes) · Apps: " + apps.length + " (" + deVerdad(apps) + " clientes)<br>" +
      cli.filter((x) => x.estado === "hablando").length + " con los que estás hablando.</p></div>" +
    '<div class="tarjeta clic" data-ir-a="encuestas"><h3>📋 Encuestas</h3><div class="grande">' + resp + (meta ? " <small>de " + meta + " respuestas</small>" : " <small>respuestas</small>") + "</div>" +
      (meta ? '<div class="barra"><div style="width:' + Math.min(100, Math.round(100 * resp / meta)) + '%"></div></div>' : "") + "<p>" + (resp === 0 ? "Aún ninguna: toca repartirlas." : enc.length + " encuestas.") + "</p></div>" +
    '<div class="tarjeta clic" data-ir-a="equipo"><h3>👥 Equipo</h3><div class="grande">' + equipo.length + " <small>" + (equipo.length === 1 ? "persona" : "personas") + "</small></div><p>" +
      (delEquipo.length ? delEquipo.length + " tareas suyas pendientes." : "Sin tareas pendientes.") +
      (recienHechas.length ? "<br>Última hecha: «" + esc(recienHechas[0].titulo) + "» (" + esc(nombreDe(recienHechas[0].para)) + ")." : "") + "</p></div>" +
    '<div class="tarjeta clic" data-ir-a="ideas"><h3>💡 Ideas</h3><div class="grande">' + ideasVivas.length + " <small>en marcha</small></div><p>" + esc(ideasVivas.slice(0, 3).map((i) => i.nombre).join(" · ")) + "</p></div>" +
    '<div class="tarjeta clic" data-ir-a="talleres"><h3>🛠️ Talleres</h3><div class="grande">' + talleres.length + " <small>en marcha</small></div><p>" + esc(talleres.map((t) => t.nombre).join(" · ") || "Ninguno ahora.") + "</p></div>" +
  "</div>";
}
$("#contenido").addEventListener("click", (e) => { const t = e.target.closest("[data-ir-a]"); if (t && !e.target.closest("button")) { apartado = t.dataset.irA; pintarJefe(); window.scrollTo(0, 0); } });

// ---------- ✅ Tareas ----------
const atrasada = (t) => t.estado !== "hecha" && t.para_cuando && String(t.para_cuando) < hoyTexto();
const dentroDe = (dias) => { const d = new Date(); d.setDate(d.getDate() + dias); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function itemTarea(t) {
  const hecha = t.estado === "hecha";
  const detalle = [nombreDe(t.para), t.idea, t.para_cuando ? "para el " + fechaCorta(new Date(t.para_cuando + "T12:00").getTime()) : "", hecha && t.hecha_el ? "hecha " + haceCuanto(t.hecha_el) : ""].filter(Boolean).join(" · ");
  return '<div class="item' + (t.quitado ? " quitado" : "") + '">' +
    (t.quitado ? "" : '<button class="marca-check' + (hecha ? " si" : "") + '" data-marcar="' + t.id + '" title="' + (hecha ? "Marcar como pendiente" : "Marcar como hecha") + '" aria-label="Hecha">' + (hecha ? "✓" : "") + "</button>") +
    '<div class="cuerpo"><div class="titulo"' + (hecha ? ' style="text-decoration:line-through;color:var(--gris)"' : "") + ">" + esc(t.titulo) + "</div>" +
    '<div class="detalle">' + (atrasada(t) ? '<span class="chip atrasada">atrasada</span>' : "") + (t.prioridad ? '<span class="chip ' + t.prioridad + '">' + t.prioridad + "</span>" : "") + (t.estado === "en curso" ? '<span class="chip ambar">en curso</span>' : "") + esc(detalle) + "</div>" +
    (t.comentario ? '<div class="detalle">💬 «' + esc(t.comentario) + "»</div>" : "") + "</div>" + botonesItem("Tareas", t) + "</div>";
}
function pTareas() {
  const filtro = subpestana.tareas || "pendientes";
  let lista = vivos("Tareas");
  const orden = { principal: 0, secundaria: 1, terciaria: 2 };
  if (filtro === "pendientes") lista = lista.filter((t) => t.estado !== "hecha");
  else if (filtro === "hechas") lista = lista.filter((t) => t.estado === "hecha");
  else if (filtro === "mias") lista = lista.filter((t) => t.para === "jefe" && t.estado !== "hecha");
  else if (filtro === "equipo") lista = lista.filter((t) => t.para && t.para !== "jefe");
  lista.sort((a, b) => (orden[a.prioridad] ?? 3) - (orden[b.prioridad] ?? 3) || b.creado - a.creado);
  return cabecera("✅ Tareas", botonNuevo("Tareas", "Tarea nueva"), "Pulsa el círculo para marcarla hecha. Al dársela a alguien del equipo, explícale el porqué y los pasos: es lo único que verá.") +
    pestanas("tareas", [["pendientes", "Pendientes"], ["mias", "Mías"], ["equipo", "Del equipo"], ["hechas", "Hechas"]], filtro) +
    (lista.length ? '<div class="lista">' + lista.map(itemTarea).join("") + "</div>" : '<div class="vacio">No hay tareas aquí.</div>') + bloqueQuitados("Tareas", itemTarea);
}
const pestanas = (clave, ops, activa) => '<div class="pestanas">' + ops.map(([id, nom]) => '<button data-pestana="' + clave + ":" + id + '" class="' + (activa === id ? "activa" : "") + '">' + nom + "</button>").join("") + "</div>";

// ---------- 👥 Equipo ----------
function itemPersona(p) {
  const suyas = vivos("Tareas").filter((t) => t.para === p.id), hechas = suyas.filter((t) => t.estado === "hecha").length;

}
function pEquipo() {

    (gente.length ? '<div class="lista">' + gente.map(itemPersona).join("") + "</div>" : '<div class="vacio">Todavía no hay nadie. Añade a tu amigo y te dará su código para pasárselo.</div>') + bloqueQuitados("Equipo", itemPersona);

}
function pDinero() {

// ---------- 🤝 Clientes ----------
const COLOR_ESTADO = { posible: "", hablando: "ambar", cliente: "verde", "ya no": "rojo" };
function itemCliente(x) {
  return '<div class="item' + (x.quitado ? " quitado" : "") + '"><div class="marca-check">' + (x.clase === "app" ? "📱" : "🧰") + '</div><div class="cuerpo"><div class="titulo">' + esc(x.nombre) +

    bloqueQuitados("Clientes", itemCliente);

// ---------- 💡 Ideas ----------
function itemIdea(i) {
  const pos = PASOS_IDEA.indexOf(i.paso);
  return '<div class="item' + (i.quitado ? " quitado" : "") + '"><div class="cuerpo"><div class="titulo">' + esc(i.nombre) + ' <span class="chip ' + (i.paso === "descartada" ? "rojo" : i.paso === "en pausa" ? "" : "ambar") + '">' + esc(i.paso || "idea") + "</span></div>" +

    botonesItem("Ideas", i, enlaceSeguro(i.enlace)) + "</div>";

function enlaceSeguro(u) { return /^https:\/\//.test(u || "") ? '<button data-abrir="' + esc(u) + '">🔗 Abrir</button>' : ""; }
function pIdeas() {
  const lista = vivos("Ideas").slice().sort((a, b) => {
    const p = (x) => x.paso === "descartada" ? 99 : x.paso === "en pausa" ? 50 : -PASOS_IDEA.indexOf(x.paso);

}

// ---------- 📋 Encuestas ----------
function itemEncuesta(x) {

  return '<div class="item' + (x.quitado ? " quitado" : "") + '"><div class="cuerpo"><div class="titulo">' + esc(x.nombre) + "</div>" +
    '<div class="detalle">' + (r === null || r === undefined ? "No puedo contar las respuestas (¿falta el ID de la hoja?)" : "<b>" + r + "</b> respuestas" + (meta ? " de " + meta : "")) + (x.idea ? " · " + esc(x.idea) : "") + "</div>" +

    botonesItem("Encuestas", x, (/^https:\/\//.test(x.enlace || "") ? '<button data-wa="' + esc(x.enlace) + '" data-nombre="' + esc(x.nombre) + '">💬 Mandar</button>' : "") + enlaceSeguro(x.enlace)) + "</div>";
}
function pEncuestas() {
  const lista = vivos("Encuestas");
  return cabecera("📋 Encuestas", botonNuevo("Encuestas", "Encuesta"), "Las respuestas se cuentan solas cada vez que entras. «💬 Mandar» abre WhatsApp con el mensaje ya escrito.") +
    (lista.length ? '<div class="lista">' + lista.map(itemEncuesta).join("") + "</div>" : '<div class="vacio">Sin encuestas.</div>') + bloqueQuitados("Encuestas", itemEncuesta);
}

// ---------- 🛠️ Talleres ----------
function itemTaller(t) {
  const total = Number(t.total) || 0, hechas = Number(t.hechas) || 0;
  return '<div class="item' + (t.quitado ? " quitado" : "") + '"><div class="marca-check">🛠️</div><div class="cuerpo"><div class="titulo">' + esc(t.nombre) +
    ' <span class="chip ' + (t.estado === "en marcha" ? "verde" : t.estado === "terminado" ? "terciaria" : "") + '">' + esc(t.estado || "") + "</span></div>" +
    (total ? '<div class="detalle">' + hechas + " de " + total + ' tareas</div><div class="barra"><div style="width:' + Math.round(100 * hechas / total) + '%"></div></div>' : "") +
    (t.notas ? '<div class="detalle">' + esc(t.notas) + "</div>" : "") + "</div>" + botonesItem("Talleres", t, enlaceSeguro(t.enlace)) + "</div>";
}
function pTalleres() {
  const orden = { "en marcha": 0, "en pausa": 1, terminado: 2 };
  const lista = vivos("Talleres").slice().sort((a, b) => (orden[a.estado] ?? 1) - (orden[b.estado] ?? 1));
  return cabecera("🛠️ Talleres", botonNuevo("Talleres", "Taller"), "Donde Claude trabaja tarea a tarea. «🔗 Abrir» lleva a la web en directo de cada taller (solo la ves tú).") +
    (lista.length ? '<div class="lista">' + lista.map(itemTaller).join("") + "</div>" : '<div class="vacio">Sin talleres.</div>') + bloqueQuitados("Talleres", itemTaller);
}

// ---------- Acciones del jefe ----------
function guardarEnCerebro(peticion, textoBien, deshacer) {
  $("#contenido").classList.add("cargando");
  return llamar(peticion).then((r) => {
    $("#contenido").classList.remove("cargando");
    if (!r.ok) { avisar(textoError(r.error)); return r; }
    datos = r.datos; avisoEquipo = r.aviso || ""; pintarJefe();
    if (textoBien) avisar(textoBien, deshacer ? () => deshacer(r) : null);
    return r;
  }).catch(() => { $("#contenido").classList.remove("cargando"); avisar(ERRORES.red); return { ok: false }; });
}
$("#contenido").addEventListener("submit", (e) => {
  if (e.target.id !== "form-aviso") return;
  e.preventDefault();
  guardarEnCerebro({ accion: "aviso", texto: e.target.elements.aviso.value }, "Aviso guardado ✓");
});
$("#contenido").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.pestana) { const [k, v] = d.pestana.split(":"); subpestana[k] = v; pintarJefe(); return; }
  if (d.nuevo) return abrirFormulario(d.nuevo, null, d.extra ? JSON.parse(d.extra) : {});
  if (d.darTarea) return abrirFormulario("Tareas", null, { para: d.darTarea, prioridad: "principal" });
  if (d.editar) return abrirFormulario(d.editar, (datos[d.editar] || []).find((x) => x.id === d.id));
  if (d.quitar) return guardarEnCerebro({ accion: "quitar", tabla: d.quitar, id: d.id }, "Quitado.", () => guardarEnCerebro({ accion: "recuperar", tabla: d.quitar, id: d.id }, "Recuperado."));
  if (d.recuperar) return guardarEnCerebro({ accion: "recuperar", tabla: d.recuperar, id: d.id }, "Recuperado.");
  if (d.marcar) {
    const t = datos.Tareas.find((x) => x.id === d.marcar), hecha = t.estado === "hecha", antes = t.estado || "pendiente";
    return guardarEnCerebro({ accion: "guardar", tabla: "Tareas", id: t.id, campos: { estado: hecha ? "pendiente" : "hecha" } }, hecha ? "Vuelve a estar pendiente." : "¡Hecha! ✅",
      () => guardarEnCerebro({ accion: "guardar", tabla: "Tareas", id: t.id, campos: { estado: antes } }, "Deshecho."));
  }
  if (d.codigo) {
    if (!confirm("¿Darle un código nuevo? El que tiene ahora dejará de funcionar.")) return;
    return guardarEnCerebro({ accion: "codigo-nuevo", id: d.codigo }).then((r) => { if (r.ok) mostrarCodigo(nombreDe(d.codigo), r.codigo); });
  }
  if (d.abrir) return window.open(d.abrir, "_blank", "noopener");
  if (d.wa) {
    const texto = "¡Hola! 😊 Estoy haciendo un proyecto y me ayudaría mucho tu opinión. Es una encuesta cortita (2 minutos, anónima): " + d.wa + " ¡Gracias!";
    return window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank", "noopener");
  }
});

function abrirFormulario(tabla, item, valores) {
  const campos = formulario(tabla);
  valores = Object.assign({}, valores || {}, item || {});
  if (tabla === "Dinero" && !valores.dia) valores.dia = hoyTexto();
  const titulos = { Tareas: "tarea", Equipo: "persona del equipo", Dinero: "movimiento", Clientes: "cliente", Ideas: "idea", Talleres: "taller", Encuestas: "encuesta" };
  const velo = document.createElement("div");
  velo.className = "velo";
  velo.innerHTML = '<form class="ventana"><h2>' + (item ? "Cambiar " : "Nueva: ") + titulos[tabla] + "</h2>" + campos.map(([k, tipo, ops]) => {
    const v = valores[k] === undefined || valores[k] === null ? "" : valores[k];
    let casilla;
    if (tipo === "lista") casilla = '<select name="' + k + '">' + ops.map(([val, nom]) => '<option value="' + esc(val) + '"' + (String(v) === String(val) ? " selected" : "") + ">" + esc(nom) + "</option>").join("") + "</select>";
    else if (tipo === "largo") casilla = '<textarea name="' + k + '">' + esc(v) + "</textarea>";
    else casilla = '<input name="' + k + '" value="' + esc(v) + '"' + (tipo === "numero" ? ' inputmode="decimal"' : tipo === "fecha" ? ' type="date"' : "") + ">";
    return '<label class="campo"><b>' + esc(ETIQUETAS[k] || k) + "</b>" + casilla + "</label>";
  }).join("") + '<div class="error" id="error-form"></div><div class="botones"><button type="button" class="secundario" data-cerrar>Cancelar</button><button class="principal" type="submit">Guardar</button></div></form>';
  document.body.appendChild(velo);
  const form = velo.querySelector("form");
  if (tabla === "Dinero") {   // las categorías cambian según sea ingreso o gasto
    const tipo = form.elements.tipo, cat = form.elements.categoria;
    const poner = () => { const actual = cat.value; cat.innerHTML = CATEGORIAS[tipo.value].map((c) => "<option" + (c === actual ? " selected" : "") + ">" + esc(c) + "</option>").join(""); };
    tipo.onchange = poner; poner();
  }
  const primero = form.querySelector("input, textarea"); if (primero) primero.focus();
  velo.querySelector("[data-cerrar]").onclick = () => velo.remove();
  velo.onclick = (e) => { if (e.target === velo) velo.remove(); };
  form.onsubmit = (e) => {
    e.preventDefault();
    const c = {};
    campos.forEach(([k]) => { c[k] = form.elements[k].value; });
    form.classList.add("cargando");
    llamar({ accion: "guardar", tabla: tabla, id: item ? item.id : undefined, campos: c }).then((r) => {
      form.classList.remove("cargando");
      if (!r.ok) { $("#error-form").textContent = textoError(r.error); return; }
      velo.remove(); datos = r.datos; avisoEquipo = r.aviso || ""; pintarJefe();
      if (r.codigo) mostrarCodigo(c.nombre, r.codigo); else avisar("Guardado ✓");
    }).catch(() => { form.classList.remove("cargando"); $("#error-form").textContent = ERRORES.red; });
  };
}

function mostrarCodigo(nombre, codigo) {
  const web = location.href.split("?")[0].split("#")[0];
  const texto = "¡Hola " + nombre + "! 👋 Ya estás en el equipo. Entra en " + web + " , pulsa «Soy del equipo» y pon este código: " + codigo + " . Ahí verás tus tareas explicadas.";
  const velo = document.createElement("div");
  velo.className = "velo";
  velo.innerHTML = '<div class="ventana"><h2>🔑 Código de ' + esc(nombre) + '</h2><p>Pásaselo a ' + esc(nombre) + '. <b>Solo se enseña ahora</b>: si se pierde, le das uno nuevo desde Equipo.</p>' +
    '<div class="codigo-grande">' + esc(codigo) + '</div><div class="botones"><button class="secundario" data-copiar>📋 Copiar mensaje</button><button class="principal" data-wa>💬 Mandar por WhatsApp</button><button class="secundario" data-cerrar>Cerrar</button></div></div>';
  document.body.appendChild(velo);
  velo.querySelector("[data-cerrar]").onclick = () => velo.remove();
  velo.querySelector("[data-wa]").onclick = () => window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank", "noopener");
  velo.querySelector("[data-copiar]").onclick = () => { try { navigator.clipboard.writeText(texto).then(() => avisar("Mensaje copiado ✓")); } catch (e) { avisar("No se ha podido copiar"); } };
}

// =====================================================================
// EQUIPO
// =====================================================================
let equipoDatos = null;
function pintarEquipo() {
  const r = equipoDatos, orden = { principal: 0, secundaria: 1, terciaria: 2 };
  const pend = r.tareas.filter((t) => t.estado !== "hecha").sort((a, b) => (orden[a.prioridad] ?? 3) - (orden[b.prioridad] ?? 3));
  const hechas = r.tareas.filter((t) => t.estado === "hecha");
  $("#equipo").innerHTML = (r.aviso ? '<div class="tablon"><b>📌 Aviso de Emmanuel</b>' + esc(r.aviso) + "</div>" : "") +
    '<div class="hola"><h1>Hola, ' + esc(r.nombre) + ' 👋</h1><p>' + (pend.length ? "Tienes " + pend.length + (pend.length === 1 ? " tarea" : " tareas") + ". Empieza por la de arriba. Cuando acabes, pulsa «✅ Hecha» y cuéntale a Emmanuel lo que has visto." : "No tienes tareas pendientes. ¡Gracias! 🙌") + "</p></div>" +
    pend.map(mision).join("") + (hechas.length ? '<h3 style="margin:20px 4px 10px;color:var(--gris)">Hechas (' + hechas.length + ")</h3>" + hechas.map(mision).join("") : "") +
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' + botonInstalar("secundario instalar") + '<button class="enlace" data-salir>🚪 Salir</button></div>';
}
function mision(t) {
  const hecha = t.estado === "hecha";
  return '<div class="mision' + (hecha ? " hecha" : "") + '">' + (t.prioridad ? '<span class="chip ' + t.prioridad + '">' + t.prioridad + "</span>" : "") + (t.estado === "en curso" ? '<span class="chip ambar">la estás haciendo</span>' : "") +
    (t.para_cuando ? '<span class="chip">para el ' + esc(fechaCorta(new Date(t.para_cuando + "T12:00").getTime())) + "</span>" : "") +
    "<h2>" + (hecha ? "✅ " : "") + esc(t.titulo) + "</h2>" +
    (t.porque ? '<div class="bloque"><b>¿Para qué sirve?</b>' + esc(t.porque) + "</div>" : "") +
    (t.como ? '<div class="bloque"><b>Cómo hacerlo</b>' + esc(t.como) + "</div>" : "") +
    (t.comentario ? '<div class="bloque"><b>Lo que contaste</b>' + esc(t.comentario) + "</div>" : "") +
    '<div class="botones">' + (hecha ? '<button class="secundario" data-deshacer="' + t.id + '">↶ No estaba hecha</button>'
      : (t.estado !== "en curso" ? '<button class="secundario" data-empezar="' + t.id + '">▶ La empiezo</button>' : "") + '<button class="principal" data-hecha="' + t.id + '">✅ Hecha</button>') + "</div></div>";
}
function accionEquipo(peticion, texto, deshacer) {
  $("#equipo").classList.add("cargando");
  return llamar(peticion).then((r) => {
    $("#equipo").classList.remove("cargando");
    if (!r.ok) { avisar(textoError(r.error)); return; }
    equipoDatos = r; pintarEquipo(); if (texto) avisar(texto, deshacer);
  }).catch(() => { $("#equipo").classList.remove("cargando"); avisar(ERRORES.red); });
}
$("#equipo").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.salir !== undefined) return salir();
  if (d.instalar !== undefined) return instalarApp();
  if (d.empezar) return accionEquipo({ accion: "empezar", id: d.empezar }, "¡A por ella! 💪");
  if (d.deshacer) return accionEquipo({ accion: "deshacer", id: d.deshacer }, "Vuelve a estar pendiente.");
  if (d.hecha) {
    const t = equipoDatos.tareas.find((x) => x.id === d.hecha);
    const velo = document.createElement("div");
    velo.className = "velo";
    velo.innerHTML = '<form class="ventana"><h2>✅ ¡Hecha!</h2><label class="campo"><b>¿Qué has visto? Cuéntaselo a Emmanuel (si quieres)</b><textarea name="c" placeholder="Ej.: lo he probado en mi móvil y el botón de guardar no se ve bien">' + esc(t.comentario || "") +
      '</textarea></label><div class="botones"><button type="button" class="secundario" data-cerrar>Cancelar</button><button class="principal" type="submit">Marcar como hecha</button></div></form>';
    document.body.appendChild(velo);
    velo.querySelector("textarea").focus();
    velo.querySelector("[data-cerrar]").onclick = () => velo.remove();
    velo.querySelector("form").onsubmit = (ev) => {
      ev.preventDefault(); const c = velo.querySelector("textarea").value; velo.remove();
      accionEquipo({ accion: "hecha", id: t.id, comentario: c }, "¡Gracias! Hecha ✅", () => accionEquipo({ accion: "deshacer", id: t.id }, "Deshecho."));
    };
  }
});

// ---------- ＋ Apuntar rápido ----------
$("#rapido").onclick = () => {
  const velo = document.createElement("div");
  velo.className = "velo";
  velo.innerHTML = '<form class="ventana"><h2>＋ Apuntar rápido</h2><label class="campo"><b>¿Qué se te ha ocurrido?</b><input name="texto" autocomplete="off" placeholder="Ej.: llamar a la ferretería del barrio"></label>' +
    '<div class="rapido-tipos"><button class="principal" data-tipo="Tareas">✅ Es una tarea</button><button class="principal" data-tipo="Ideas">💡 Es una idea</button></div>' +
    '<div class="error" id="error-rapido"></div><button type="button" class="enlace" data-cerrar>Cancelar</button></form>';
  document.body.appendChild(velo);
  const form = velo.querySelector("form"), input = form.elements.texto;
  input.focus();
  velo.querySelector("[data-cerrar]").onclick = () => velo.remove();
  velo.onclick = (e) => { if (e.target === velo) velo.remove(); };
  form.onsubmit = (e) => { e.preventDefault(); form.querySelector('[data-tipo="Tareas"]').click(); };
  form.querySelectorAll("[data-tipo]").forEach((b) => b.onclick = (e) => {
    e.preventDefault();
    const texto = input.value.trim();
    if (!texto) { $("#error-rapido").textContent = "Escribe algo primero."; return; }
    const tabla = b.dataset.tipo;
    const campos = tabla === "Tareas" ? { titulo: texto, para: "jefe" } : { nombre: texto, paso: "idea" };
    velo.remove();
    guardarEnCerebro({ accion: "guardar", tabla: tabla, campos: campos }, tabla === "Tareas" ? "Tarea apuntada ✓" : "Idea apuntada 💡");
  });
};

// ---------- 📲 Instalar como app ----------
let avisoInstalar = null;
const esIphone = /iphone|ipad|ipod/i.test(navigator.userAgent);
const yaInstalada = () => (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); avisoInstalar = e; if (datos) pintarJefe(); else if (equipoDatos) pintarEquipo(); });
function botonInstalar(clase) {
  if (yaInstalada() || (!avisoInstalar && !esIphone)) return "";
  return '<button class="' + (clase || "") + '" data-instalar>📲 Instalar app</button>';
}
function instalarApp() {
  if (avisoInstalar) { avisoInstalar.prompt(); avisoInstalar.userChoice.finally(() => { avisoInstalar = null; if (datos) pintarJefe(); else if (equipoDatos) pintarEquipo(); }); return; }
  avisar("En iPhone: pulsa Compartir ⬆️ y luego «Añadir a pantalla de inicio».");
}
if ("serviceWorker" in navigator && location.protocol === "https:" && !MODO_DEMO) navigator.serviceWorker.register("sw.js").catch(() => {});

// ---------- Arranque ----------
if (MODO_DEMO) $("#demo").classList.remove("oculto");
const guardada = leerGuardada();
if (guardada && guardada.secreto) {
  sesion = guardada;
  llamar({}).then((r) => { if (r.ok) recibir(r); else { guardarSesion(null); sesion = null; } }).catch(() => { sesion = null; });
}
</script>
